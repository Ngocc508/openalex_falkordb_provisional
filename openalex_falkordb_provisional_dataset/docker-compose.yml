version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb_provisional
    ports:
      - "127.0.0.1:6379:6379"  # Chặn truy cập từ Internet, chỉ cho phép Localhost
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb_data:/data     # Volume lưu trữ bền vững
    environment:
      - FALKORDB_ARGS=--requirepass ${FALKORDB_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${FALKORDB_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight_openalex
    ports:
      - "127.0.0.1:5540:5540"  # Cổng GUI Tool trực quan hóa đồ thị tại http://localhost:5540
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  falkordb_data: